<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Form</title>
  <link rel="stylesheet" href="traningform.css" />
</head>
<body>

  <header>
    <h1>Training Form</h1>
    <p>Thank you for submitting your training details. Please provide the necessary information.</p>
  </header>

  <main class="trainingForm">
    <!-- Action points to the "thank you/progress" page -->
    <form 
      id="personalInformation" 
      class="personalInformation" 
      method="POST" 
      action="runningdata.html"
    >
      <fieldset>
        <legend>Personal Information</legend>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required placeholder="example@email.com" />
        </div>

        <div class="form-group">
          <label>Type of Training:</label>
          <div class="checkbox-group">
            <input type="checkbox" id="run" name="type" value="run" />
            <label for="run">Run</label>

            <input type="checkbox" id="hike" name="type" value="hike" />
            <label for="hike">Hike</label>
          </div>
        </div>

        <div class="form-group">
          <label for="distance">Distance (km):</label>
          <input type="number" id="distance" name="distance" required placeholder="Ex. 5" />
        </div>

        <div class="form-group">
          <label for="duration">Time (min):</label>
          <input type="number" id="duration" name="duration" required placeholder="Ex. 30" />
        </div>

        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <button type="submit">Submit</button>
        </div>
      </fieldset>
    </form>
  </main>

  <footer>
    <nav>
      <a href="index.html">Home</a>
      <a href="trainingForm.html">Running Data</a>
      <a href="resume.html">Resume</a>
      <a href="datavisuals.html">Graphs</a>
      <a href="blog.html">Professional Blog</a>
      <a href="Gardening.html">Sustainability</a>
    </nav>
  </footer>

</body>
</html>
